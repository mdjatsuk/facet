services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: facet-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - facet-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d facet-db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./Backend/FacetApi
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Port=5432;Database=facet-db;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Jwt__Issuer: ${JWT_ISSUER:-Facet.Local}
      BootstrapAdmin__Username: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - facet-storage:/app/storage

  frontend:
    build:
      context: ./Frontend
      args:
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:5000/api}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  facet-db:
  facet-storage:
